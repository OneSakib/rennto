services:
  db:
    image: postgres:16-alpine
    container_name: rennto-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rennto
      POSTGRES_USER: rennto
      POSTGRES_PASSWORD: rennto
    ports:
      - "5432:5432"
    volumes:
      - rennto_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rennto -d rennto"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: rennto-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  rennto_postgres_data:
